spring:
  application:
    name: etude
  web:
    # Server messages (e.g. validation) stay English regardless of Accept-Language; clients localize by code.
    locale: en
    locale-resolver: fixed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        # Embedded/composite columns are named by attribute path: price.amount -> price_amount
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
  modulith:
    runtime:
      flyway-enabled: true
# Defaults are production-safe; the local and test profiles turn development features on.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

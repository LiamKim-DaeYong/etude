version: 2

updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels:
      - type:infra
      - area:frontend
    commit-message:
      prefix: 'chore(deps): 의존성 갱신'
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
      playwright:
        patterns:
          - '@playwright/*'
          - playwright
          - playwright-core
          - '@axe-core/playwright'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    labels:
      - type:infra
      - area:shared
    commit-message:
      prefix: 'chore(ci): 의존성 갱신'
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
